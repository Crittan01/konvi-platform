# render.yaml — Konvi Platform
# Infraestructura como código para Render.com
# Referencia oficial: https://render.com/docs/blueprint-spec
# Última actualización: 2026-04-25 (v8 — nuevas vars post sesiones rev. 57-59)
#
# USO:
#   1. Render detecta este archivo automáticamente desde el repo
#   2. Configurar las env vars (sync: false) manualmente en Render Dashboard
#   3. Ver contexto operativo actualizado en docs/HANDOFF.md
#   4. Referencia canónica de variables: .env.example
#
# HISTORIAL:
#   v1–v7: ver historial anterior
#   v8: CONVERSATION_HISTORY_LIMIT=25 (era 10), vars de R-01/R-03/R-09/R-10
#       API_RATE_LIMIT_DISTRIBUTED=true (rate limiter distribuido PostgreSQL)
#       PENDING_PAYMENT_RELEASE_* (job de liberación de stock expirado)
#       ANTI_HIBERNATION_* (ping anti-hibernación Render Free)
#       MAX_PROCESSING_ATTEMPTS=5 (era implícito — se hace explícito)

services:

  # ─────────────────────────────────────────────────────────────────────────
  # 1. FRONTEND — Next.js Backoffice
  #    URL: https://konvi-web.onrender.com
  #    FIX: eliminadas dependencias workspace:* que rompían npm install en Render
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: konvi-web
    runtime: node
    region: oregon
    plan: starter
    rootDir: apps/web
    # Memory profile build: next build + Sentry instrumentation peak ~1.3 GB RSS.
    # Render build container = más RAM que runtime (runtime free=512 MB; build
    # container típicamente 2-4 GB en Free tier). 1500 MB Node heap deja margen.
    # Si vuelve OOM: subir a 2048 o migrar el wrap Sentry (sin auth token skip).
    #
    # pnpm (via corepack en modo SHIM `corepack pnpm@x ...`) — NO npm, NO `corepack
    # enable`. El repo es un workspace pnpm con lockfile: CI usa `pnpm
    # --frozen-lockfile` y se valida con pnpm. `npm install` resolvía versiones
    # DISTINTAS (@types/react / @radix-ui drift) → type-errors que no aparecen con
    # pnpm. `corepack enable` falla en Render (EROFS: /usr/bin read-only); el modo
    # shim ejecuta pnpm sin escribir symlinks globales. --frozen-lockfile garantiza
    # el árbol EXACTO validado. COREPACK_ENABLE_DOWNLOAD_PROMPT=0 evita el prompt.
    buildCommand: corepack pnpm@10.33.0 install --frozen-lockfile && NODE_OPTIONS='--max-old-space-size=1500' corepack pnpm@10.33.0 run build
    startCommand: corepack pnpm@10.33.0 run start
    envVars:
      - key: NODE_ENV
        value: production
      # corepack en modo shim: no preguntar antes de descargar pnmp@10.33.0.
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      # ──── Supabase API keys ───────────────────────────────────────────────
      # Sistema NUEVO (canónico): Publishable + Secret keys.
      # Legacy ANON_KEY/SERVICE_ROLE_KEY se mantienen mientras código migra
      # en A0.2b/A0.2c — eliminar legacy en sub-fase posterior.
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false                              # sb_publishable_* — cliente browser
      - key: SUPABASE_SECRET_KEY
        sync: false                              # sb_secret_* — SSR + auth.admin.*
      # LEGACY (eliminar post A0.2b refactor apps/web/utils/supabase/*.ts)
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false                              # [DEPRECATED] reemplazado por PUBLISHABLE_KEY
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false                              # [DEPRECATED] reemplazado por SECRET_KEY
      # URL pública del frontend — leida en runtime por Server Actions (invite flow)
      # SIN prefijo NEXT_PUBLIC_ para evitar bake-in en tiempo de build
      - key: APP_URL
        value: https://app.konvi.co
      # NEXT_PUBLIC_APP_URL — bundle browser bake-in (cliente JS). Mismo valor que APP_URL.
      - key: NEXT_PUBLIC_APP_URL
        value: https://app.konvi.co
      - key: API_URL
        value: https://konvi-api.onrender.com
      - key: APP_ENV
        value: production
      # Rev. 72 — GEMINI_API_KEY se MOVERÁ del web al api (drift D3 cierre planeado).
      # Hoy aún se lee en apps/web/app/api/{insights,ai/preview}/route.ts (deuda técnica).
      # Mantener temporalmente hasta refactorizar esos 2 endpoints SSR al servicio api.
      - key: GEMINI_API_KEY
        sync: false
      # Alinea el modelo del web (insights/ai-preview SSR) con prod. Sin esto el
      # código cae a su default gemini-3.5-flash → diverge del orchestrator/api.
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      # Rev. 109 J.2.7.4 — Sentry tracing E2E. 4 vars: 2 server + 2 browser bundle.
      - key: SENTRY_DSN
        sync: false                              # konvi-web project DSN
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: SENTRY_ENV
        value: production
      - key: NEXT_PUBLIC_SENTRY_DSN              # MISMO valor que SENTRY_DSN (bundle)
        sync: false
      - key: NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: NEXT_PUBLIC_SENTRY_ENV
        value: production
      # Build-time: source map upload + release tagging. Sin esto Sentry
      # muestra stack traces minified — debugging produccion limitado.
      - key: SENTRY_ORG
        value: konvi-e5                          # SLUG real de la org (display "konvi"; Sentry sufijó -e5)
      - key: SENTRY_PROJECT
        value: konvi-web                          # confirmar slug en Sentry si el upload de sourcemaps falla por project
      - key: SENTRY_AUTH_TOKEN
        sync: false                              # Organization Token (sntrys_...), scope org:ci (Source Map Upload + Release Creation)
      # F83 seguridad — secreto HMAC para firmar la cookie de sesión de recovery MFA.
      # Sin esto la cookie era el literal '1' (bypass total de AAL2). Generar con:
      # openssl rand -hex 32. El middleware (Edge) verifica la firma con Web Crypto.
      - key: MFA_RECOVERY_COOKIE_SECRET
        sync: false                              # openssl rand -hex 32
    healthCheckPath: /
    branch: production
    autoDeploy: true

  # ─────────────────────────────────────────────────────────────────────────
  # 2. WHATSAPP CONNECTOR — FastAPI Webhook Gateway
  #    URL: https://konvi-connector.onrender.com
  #    Stack: FastAPI + supabase==2.28.3 + httpx==0.28.1
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: konvi-connector
    runtime: python
    region: oregon
    plan: starter
    rootDir: services/connector-whatsapp
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      # ──── Supabase Secret key (NEW canonical) + legacy SERVICE_ROLE_KEY ───
      # Legacy se elimina post A0.2c (refactor services/connector-whatsapp/services/db_persistence.py).
      - key: SUPABASE_SECRET_KEY
        sync: false                              # sb_secret_*
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false                              # [DEPRECATED] fallback de SECRET_KEY (db_persistence.py:15)
      # META_APP_SECRET / META_VERIFY_TOKEN eliminados (verificado 0 lectores): Model B
      # (ADR-0023) resuelve app_secret + verify_token per-tenant desde Vault/credentials
      # JSONB (dependencies/meta.py), no desde env. ALLOWED_ORIGINS eliminada: el
      # connector no monta CORS (webhook server-to-server, main.py sin CORSMiddleware).
      - key: APP_ENV
        value: production
      # Rev. 109 J.2.7.4 — Sentry tracing (konvi-connector project DSN).
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      # SENTRY_ENV eliminada: el connector deriva environment de RENDER_SERVICE_NAME
      # (observability.py:102), nunca lee SENTRY_ENV.
      # W5/T4-01 — IP real del cliente detrás del edge de Render. Render usa Cloudflare y
      # forwardea CF-Connecting-IP con la IP REAL del cliente (evidencia: arcjet-js#3899
      # muestra XFF de 3 hops "cliente, cf-proxy, hop-interno" + cf-connecting-ip=cliente;
      # Cloudflare docs: "provides the client IP connecting to Cloudflare to the origin").
      # Es INMUNE al nº de hops (a diferencia de XFF_TRUSTED_HOPS_FROM_RIGHT) y al futuro
      # api.konvi.co proxied. resolve_client_ip cae grácil al XFF si el header falta.
      - key: TRUSTED_CLIENT_IP_HEADER
        value: cf-connecting-ip
    healthCheckPath: /health
    branch: production
    autoDeploy: true

  # ─────────────────────────────────────────────────────────────────────────
  # 3. CORE API — FastAPI REST Gateway (Fase 6 ✅)
  #    URL: https://konvi-api.onrender.com
  #    Stack: fastapi==0.139.0 + supabase==2.31.0 + PyJWT==2.13.0
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: konvi-api
    runtime: python
    region: oregon
    plan: starter
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      # ──── Supabase Secret key (NEW canonical) + legacy SERVICE_ROLE_KEY ───
      # Legacy se elimina post A0.2c (refactor services/api/dependencies/auth.py + main.py).
      - key: SUPABASE_SECRET_KEY
        sync: false                              # sb_secret_*
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false                              # [DEPRECATED] reemplazado por SECRET_KEY
      # JWT secret (legacy HS256) — aún requerido por auth.py + payment_link_tool +
      # shipping_quote_tool hasta refactor A0.2b (JWKS asymmetric) + A0.2c
      # (INTERNAL_SERVICE_SECRET para service-to-service).
      - key: SUPABASE_JWT_SECRET
        sync: false                              # [TRANSITIONAL] eliminar post-A0.2b/c
      # Service-to-service auth (orchestrator → api) post-A0.2c. Lee internal_auth.py.
      - key: INTERNAL_SERVICE_SECRET
        sync: false                              # openssl rand -hex 32 (NUEVO)
      - key: ALLOWED_ORIGINS
        sync: false
      # URLs runtime para construir links absolutos (emails, OAuth callbacks).
      - key: APP_URL
        value: https://app.konvi.co
      - key: APP_ENV
        value: production
      # MFA OBLIGATORIO (D1/D2/D3) — enforcement de ENROLAMIENTO para write-roles
      # (owner/manager). Rollout SEGURO: deploy con ENABLED=false → notificar users →
      # setear MFA_MANDATORY_START a la fecha del flip → ENABLED=true (todos reciben la
      # gracia desde START). deadline = max(created_at, START) + GRACE_DAYS. Lee auth.py.
      - key: MFA_MANDATORY_ENABLED
        value: "false"                           # flip a "true" en el dashboard cuando listo
      - key: MFA_MANDATORY_GRACE_DAYS
        value: "14"
      - key: MFA_MANDATORY_START
        sync: false                              # fecha ISO del flip (ej. 2026-08-01); setear al activar
      # URL pública del API para registrar webhooks de providers externos
      # (Aveonline webhookEstadosGuias, futuro Envia, etc.). DEBE ser HTTPS.
      - key: PUBLIC_WEBHOOK_URL
        value: https://konvi-api.onrender.com
      # Email transaccional Resend (notificaciones post-pago + Habeas Data).
      # Sin la var, notifications.py loguea en lugar de enviar (fallback graceful).
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "Konvi <noreply@konvi.co>"
      # Aveonline generación REAL de guías (true=factura) vs simulado (false=dry-run).
      # Default false hasta que tenant confirme listo para prod facturar guías reales.
      - key: AVEONLINE_GENERATE_REAL_GUIDES
        value: "false"
      # UAT founder 2026-07-10: pausa (seg) antes de generar la guía en el path
      # automático post-pago (ventana de cancelación/edición; decisión founder: 1 min).
      - key: GUIDE_GENERATION_DELAY_SECONDS
        value: "60"
      # Rev. 72 — Embeddings KB ahora se calculan server-side aquí (cierra drift D3).
      # Mover el valor desde el servicio web (donde estaba antes) a este.
      - key: GEMINI_API_KEY
        sync: false
      # NOTA: el api NO declara ANTHROPIC_API_KEY a propósito — su único caller de
      # cascade (ai_preview._run_cascade) NO inyecta claude_invoker, así que el tier
      # claude-sonnet-4-5 se saltea SIEMPRE aquí. El rescue Claude real vive en el
      # orchestrator (llm_claude_rescue.py); la key se declara solo en ese bloque.
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2          # Fase 6: embedding-001 se retira (doc oficial); 2 = 3072-dim (schema OK)
      - key: GEMINI_EMBEDDING_FALLBACK_MODEL
        value: gemini-embedding-2          # text-embedding-004 apagado ene-2026; único modelo vigente compatible
      # ── MeLi OAuth (Fase 10) — requiere IH-007: registrar app en MeLi Developers ──
      - key: MELI_CLIENT_ID
        sync: false
      - key: MELI_CLIENT_SECRET
        sync: false
      - key: MELI_REDIRECT_URI
        sync: false
        # Valor: https://konvi-api.onrender.com/api/v1/integrations/meli/callback
      - key: MELI_AUTH_URL
        sync: false
        # CO: https://auth.mercadolibre.com.co/authorization (default)
        # MX: https://auth.mercadolibre.com.mx/authorization
        # AR: https://auth.mercadolibre.com.ar/authorization
      - key: MELI_OAUTH_STATE_SECRET
        sync: false
      # ── Telegram Webhook bidireccional (F6) ────────────────────────────────
      # Secret configurado en setWebhook — enviado por Telegram en X-Telegram-Bot-Api-Secret-Token
      # IH: curl "https://api.telegram.org/bot{TOKEN}/setWebhook" -d "url=...&secret_token={VALOR}"
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: MELI_OAUTH_STATE_TTL_SECONDS
        value: "600"
      - key: PLAN_ENFORCEMENT_ENABLED
        value: "true"
      # Nota rev. 109: ENVIA_PHASE2_ENABLED eliminado con pivote a Aveonline (ADR-0019).
      - key: API_RATE_LIMIT_ENABLED
        value: "true"
      - key: API_RATE_LIMIT_WRITE_PER_MINUTE
        value: "120"
      - key: API_RATE_LIMIT_SEND_PER_MINUTE
        value: "40"
      - key: API_RATE_LIMIT_DISTRIBUTED
        value: "true"
      # ── MeLi webhook origin allowlist (opcional override) ───────────────────
      # Default en código incluye las 4 IPs oficiales (verificada 2026-04-28).
      # Configurar aquí solo si MeLi cambia las IPs antes del próximo redeploy.
      - key: MELI_WEBHOOK_ALLOWED_IPS
        sync: false
      # ── MeLi alerta proactiva (rev. 69) ─────────────────────────────────────
      # Si N rechazos de origen excede el umbral en la ventana, log warning
      # estructurado para que el operador filtre en Render Dashboard.
      - key: MELI_WEBHOOK_ALERT_THRESHOLD
        value: "5"
      - key: MELI_WEBHOOK_ALERT_WINDOW_SECONDS
        value: "300"
      # ── Wompi — credenciales por-tenant en Supabase Vault (tenant_integrations) ──
      # Las llaves de Wompi se ingresan por tenant en Ajustes → Integraciones → Wompi.
      # No se necesitan env vars globales para Wompi.
      # Rev. 109 J.2.7.4 — Sentry tracing (konvi-api project DSN).
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: SENTRY_ENV
        value: production
      # W5/T4-01 — IP real del cliente vía CF-Connecting-IP (Render forwardea el header de
      # Cloudflare con la IP real, unspoofable, inmune al nº de hops). Cubre rate-limit
      # (wompi/aveonline/meli), allowlist MeLi y audit IP de offboarding. Fallback grácil
      # al XFF si el header falta. Ref: arcjet-js#3899 + Cloudflare HTTP headers docs.
      - key: TRUSTED_CLIENT_IP_HEADER
        value: cf-connecting-ip
    healthCheckPath: /health
    branch: production
    autoDeploy: true

  # ─────────────────────────────────────────────────────────────────────────
  # 4. AI ORCHESTRATOR — Web Service con worker en thread de fondo
  #    URL: https://konvi-orchestrator.onrender.com (solo /health y /status)
  #    FIX: type:worker no disponible en Free → type:web con server.py wrapper
  #    El OrchestratorWorker corre en un daemon thread dentro del mismo proceso.
  #    Referencia: https://render.com/docs/free#free-web-services
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: konvi-orchestrator
    runtime: python
    region: oregon
    plan: starter
    rootDir: services/ai-orchestrator
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      # ──── Supabase Secret key (NEW canonical) + legacy SERVICE_ROLE_KEY ───
      # Legacy se elimina post A0.2c (refactor worker.py + server.py + tools/).
      - key: SUPABASE_SECRET_KEY
        sync: false                              # sb_secret_*
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false                              # [DEPRECATED] reemplazado por SECRET_KEY
      # JWT secret (legacy HS256) — aún requerido por payment_link_tool + shipping_quote_tool
      # hasta refactor A0.2c (INTERNAL_SERVICE_SECRET header-based).
      - key: SUPABASE_JWT_SECRET
        sync: false                              # [TRANSITIONAL] eliminar post-A0.2c
      # Service-to-service auth (orchestrator → api) post-A0.2c.
      - key: INTERNAL_SERVICE_SECRET
        sync: false                              # openssl rand -hex 32 (NUEVO)
      - key: API_URL
        value: https://konvi-api.onrender.com
      # URL pública del frontend — usada por notifications.py para los links de
      # email del bot (/dashboard/inbox). Sin esto, el default es onrender.
      - key: APP_URL
        value: https://app.konvi.co
      - key: APP_ENV
        value: production
      # AVEONLINE generación REAL de guías (true=factura) vs simulado (false=dry-run).
      - key: AVEONLINE_GENERATE_REAL_GUIDES
        value: "false"
      # F6 — hard-delete de tenants con grace period expirado (Ley 1581 derecho de supresión).
      # Habilitado tras verificar prerequisitos: RPC fn_hard_delete_tenant ✓, bucket offboarding-archive ✓,
      # grace period + snapshot-antes-de-borrar ✓, 0 pendientes al activar. Solo actúa sobre solicitudes de
      # borrado cuyo grace period YA expiró; archiva a Storage antes de borrar (atómico vía RPC).
      - key: TENANT_HARD_DELETE_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      # LLM cascade tier 4 (rev. 109) — Claude rescue cuando Gemini falla cascada
      # 3 tiers. Sin la var, cascade se queda en 3 tiers (degraded path → human).
      - key: ANTHROPIC_API_KEY
        sync: false
      # LLM fallback adicional cuando Gemini + Claude no disponibles.
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2          # Fase 6: embedding-001 se retira (doc oficial); 2 = 3072-dim (schema OK)
      - key: GEMINI_EMBEDDING_FALLBACK_MODEL
        value: gemini-embedding-2          # text-embedding-004 apagado ene-2026; único modelo vigente compatible
      - key: INBOX_SHIPPING_DEFAULT_WEIGHT_KG
        value: "1"
      - key: INBOX_SHIPPING_DEFAULT_LENGTH_CM
        value: "10"
      - key: INBOX_SHIPPING_DEFAULT_WIDTH_CM
        value: "10"
      - key: INBOX_SHIPPING_DEFAULT_HEIGHT_CM
        value: "10"
      - key: INBOX_SHIPPING_TIMEOUT_SECONDS
        value: "25"
      - key: POLL_INTERVAL_SECONDS
        value: "3"
      - key: CONVERSATION_HISTORY_LIMIT
        value: "25"
      - key: CONVERSATION_WINDOW_HOURS
        value: "24"
      - key: HUMAN_TAKEOVER_QUEUE_ENABLED
        value: "true"
      - key: HUMAN_TAKEOVER_QUEUE_POLL_BATCH
        value: "10"
      - key: HUMAN_TAKEOVER_QUEUE_VT_SECONDS
        value: "90"
      - key: WHATSAPP_OUTBOUND_QUEUE_ENABLED
        value: "true"
      - key: WHATSAPP_OUTBOUND_QUEUE_POLL_BATCH
        value: "20"
      - key: WHATSAPP_OUTBOUND_QUEUE_VT_SECONDS
        value: "90"
      - key: WHATSAPP_OUTBOUND_MAX_ATTEMPTS
        value: "5"
      - key: IDEMPOTENCY_CLEANUP_ENABLED
        value: "true"
      - key: IDEMPOTENCY_CLEANUP_INTERVAL_SECONDS
        value: "3600"
      - key: IDEMPOTENCY_CLEANUP_BATCH
        value: "2000"
      # ── Liberación de pedidos pending_payment expirados (R-01) ────────────
      - key: PENDING_PAYMENT_RELEASE_ENABLED
        value: "true"
      - key: PENDING_PAYMENT_RELEASE_INTERVAL_SECONDS
        value: "600"
      - key: PENDING_PAYMENT_TTL_MINUTES
        value: "35"
      # ── Rev. 103 F1 — Recordatorio de pago dentro CSW (Meta 24h) ──────────
      - key: PAYMENT_REMINDER_ENABLED
        value: "true"
      - key: PAYMENT_REMINDER_INTERVAL_SECONDS
        value: "60"
      - key: PAYMENT_REMINDER_DELAY_MINUTES
        value: "25"
      - key: PAYMENT_REMINDER_WINDOW_MINUTES
        value: "5"
      - key: META_CSW_HOURS
        value: "24"
      # ── D-F7 — Knobs de crons versionados (higiene de config) ─────────────
      # Estos parámetros existían solo como defaults implícitos en worker.py; se
      # exponen aquí para evitar cambios silenciosos y dar un runbook operable.
      # Valores = default del código. Runbook + semántica: services/ai-orchestrator/README.md.
      #
      # Cliente mudo: el cliente escribió y no le llegó respuesta. Vigila el SÍNTOMA,
      # así que cubre de una vez los seis caminos por los que un mensaje se pierde.
      - key: SILENT_CONV_DETECTOR_ENABLED
        value: "true"
      - key: SILENT_CONV_CHECK_INTERVAL_SECONDS
        value: "300"                             # 5 min
      - key: SILENT_CONV_SILENCE_MINUTES
        value: "10"                              # procesar tarda ~9-60s; 10 min ya es pérdida
      # Coherencia del dinero: pedidos cuyas cifras no cuadran consigo mismas.
      # Ley 1480 art. 26 — ante dos precios el consumidor solo debe el menor.
      - key: ORDER_COHERENCE_CHECK_ENABLED
        value: "true"
      - key: ORDER_COHERENCE_INTERVAL_SECONDS
        value: "1800"                            # 30 min
      - key: ORDER_COHERENCE_WINDOW_HOURS
        value: "48"
      # Registro de la aceptación del pedido. Ley 1480 art. 50 lit. d) exige que la
      # manifestación de voluntad del comprador sea "verificable por la autoridad
      # competente"; hasta ahora solo existía como texto suelto en una conversación que
      # la retención borraba a los 180 días. Va SEPARADO del flag de comprobantes a
      # propósito: son dos obligaciones distintas y apagar una no puede apagar la otra.
      - key: ACCEPTANCE_STAMP_ENABLED
        value: "true"
      - key: ACCEPTANCE_STAMP_INTERVAL_SECONDS
        value: "600"                             # 10 min
      - key: ACCEPTANCE_MIN_AGE_MINUTES
        value: "5"                               # antes que el comprobante (10)
      - key: ACCEPTANCE_WINDOW_DAYS
        value: "30"
      # Comprobante de compra (ADR-0040). Ley 1480 art. 50 lit. d) obliga a remitir
      # acuse de recibo a más tardar el día calendario siguiente.
      - key: RECEIPT_ISSUE_ENABLED
        value: "true"
      - key: RECEIPT_ISSUE_INTERVAL_SECONDS
        value: "600"                             # 10 min
      - key: RECEIPT_MIN_AGE_MINUTES
        value: "10"                              # margen para que existan los order_items
      - key: RECEIPT_WINDOW_HOURS
        value: "72"
      - key: RECEIPT_ACK_ENABLED
        value: "true"                            # acuse corto por WhatsApp
      - key: RECEIPT_EMAIL_ENABLED
        value: "true"                            # detalle completo por correo
      # Constancia de la queja de reversión del pago. Decreto 1074 art. 2.2.2.51.4: el
      # proveedor DEBE emitir constancia con fecha y causal, y el consumidor la necesita
      # para notificar a su banco (art. 2.2.2.51.7 num. 6). Sin ella no puede ejercer el
      # derecho, así que se ENTREGA, no se deja disponible.
      - key: REVERSAL_CONSTANCIA_ENABLED
        value: "true"
      - key: REVERSAL_SWEEP_INTERVAL_SECONDS
        value: "300"                             # 5 min
      - key: REVERSAL_BATCH
        value: "50"
      # Poll de anulaciones Wompi (voids) tras cancelación/expiry (R-01 sibling).
      - key: WOMPI_VOID_POLL_ENABLED
        value: "true"
      - key: WOMPI_VOID_POLL_INTERVAL_SECONDS
        value: "1800"                            # 30 min
      - key: WOMPI_VOID_POLL_LOOKBACK_HOURS
        value: "48"
      # W2 — Reconciliación del inbox durable Wompi: re-drive de webhooks de pago
      # perdidos por crash del API entre el 200 ACK y el fin del procesamiento.
      # El worker re-POSTea el payload crudo a la API (worker.py:137-144).
      - key: WOMPI_INBOX_RECONCILE_ENABLED
        value: "true"
      - key: WOMPI_INBOX_RECONCILE_INTERVAL_SECONDS
        value: "180"                             # 3 min
      # A10 (auditoría 2026-08-02) — Polling backup de tracking Aveonline: si el
      # tenant no registró el webhook de estados (o un evento se pierde), el envío
      # se congelaba. El worker consulta get_estado (obtenerEstadoAuth) para guías
      # reales stale y aplica la misma semántica del webhook (dedup + monotónico +
      # notificación). Defaults = los del código (worker.py).
      - key: AVEONLINE_STATUS_POLL_ENABLED
        value: "true"
      - key: AVEONLINE_STATUS_POLL_INTERVAL_SECONDS
        value: "3600"                            # 1 h
      - key: AVEONLINE_STATUS_POLL_STALE_HOURS
        value: "6"                               # sin update vía webhook >6h → candidato
      - key: AVEONLINE_STATUS_POLL_BATCH
        value: "25"                              # cap de guías por ciclo
      # Recordatorio de carrito abandonado (HSM MARKETING cart_abandoned_24h_v1).
      - key: CART_ABANDONED_REMINDER_ENABLED
        value: "true"
      - key: CART_ABANDONED_REMINDER_INTERVAL_SECONDS
        value: "300"                             # cada 5 min
      - key: CART_ABANDONED_THRESHOLD_HOURS
        value: "24"                              # antigüedad mínima del carrito
      - key: CART_ABANDONED_MAX_AGE_HOURS
        value: "72"                              # antigüedad máxima (fuera → no se molesta)
      - key: CART_ABANDONED_DISCOUNT_LABEL
        value: "10%"
      # Retirados los CART_ABANDONED_QUIET_*: el horario de contacto lo aplica ahora
      # el gate (lib/outbound_gate.py) con la ventana LEGAL de la Ley 2300
      # (L-V 7-19, sáb 8-15, nunca domingos ni festivos) y la zona real
      # America/Bogota. Los knobs viejos estaban apagados, usaban una ventana que
      # no era la de la ley y no miraban día de semana ni festivos.
      - key: COLOMBIA_UTC_OFFSET_HOURS
        value: "-5"
      # Tope de envíos cart_abandoned por tenant por ciclo (anti-ráfaga).
      - key: CART_ABANDONED_MAX_PER_TENANT_PER_CYCLE
        value: "15"
      # SLA de takeover humano — alerta si no hay respuesta humana en N horas.
      - key: HUMAN_TAKEOVER_SLA_CHECK_INTERVAL_SECONDS
        value: "600"                             # 10 min
      - key: HUMAN_TAKEOVER_SLA_HOURS
        value: "2"
      # Health metrics collector per-tenant per-provider (J.2.11).
      - key: HEALTH_METRICS_ENABLED
        value: "true"
      - key: HEALTH_METRICS_INTERVAL_SECONDS
        value: "300"                             # 5 min
      # Reclamo de mensajes 'processing' colgados (recuperación de fallos).
      - key: STALE_PROCESSING_RECLAIM_MINUTES
        value: "3"
      - key: STALE_PROCESSING_SWEEP_INTERVAL_SECONDS
        value: "60"
      # Hard-delete de tenants (grace period expirado). ENABLED arriba (L315).
      - key: TENANT_HARD_DELETE_INTERVAL_SECONDS
        value: "21600"                           # 6 h
      - key: TENANT_HARD_DELETE_BATCH_SIZE
        value: "10"
      # ── Anti-hibernación Render (R-10) — DESHABILITADO 2026-07-17 ─────────────
      # Ya no hace falta: los 4 servicios pasaron a Starter (always-on), no hay
      # spin-down de 15min que evitar. El ping era un hack para el tier Free.
      # Se deja el código (worker.py no-opea con ENABLED=false, ver :310) + las vars
      # por si se necesitara reactivar. PING_URL sigue en el Dashboard (sync: false).
      - key: ANTI_HIBERNATION_ENABLED
        value: "false"
      - key: ANTI_HIBERNATION_PING_URL
        sync: false
      - key: ANTI_HIBERNATION_INTERVAL_SECONDS
        value: "840"
      - key: MAX_PROCESSING_ATTEMPTS
        value: "5"
      # ── Multimodal audio (rev. 67) ────────────────────────────────────────
      # Comprensión de audios WhatsApp via Gemini 2.5 Flash multimodal.
      # Default "true" — apagar a "false" sin redeploy si hay issues en producción.
      - key: MULTIMODAL_AUDIO_ENABLED
        value: "true"
      - key: META_MEDIA_MAX_BYTES
        value: "16777216"
      - key: META_MEDIA_DOWNLOAD_TIMEOUT_SECONDS
        value: "10"
      # CART_RECOVERY_ENABLED / CART_RECOVERY_LOOKBACK_DAYS eliminadas (verificado 0
      # lectores en el repo): config huérfana; el código F7-lite (rev.70) que las leía
      # ya no existe. No cambia comportamiento.
      # ── Habeas Data — notificaciones email vía Resend (rev. 94) ──────────
      # Sin RESEND_API_KEY: notifications.py loguea en lugar de enviar email
      # (fallback graceful, no rompe flujo). Para activar en producción:
      # 1. Crear cuenta en https://resend.com (free tier 100 emails/día).
      # 2. Configurar la API key en Render Dashboard (sync: false).
      # 3. Verificar dominio en Resend si se quiere from custom.
      - key: RESEND_API_KEY
        sync: false                              # Configurar en Render Dashboard
      - key: RESEND_FROM_EMAIL
        value: "Konvi <noreply@konvi.co>"
      # Rev. 109 J.2.7.4 — Sentry tracing (konvi-orchestrator project DSN).
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: SENTRY_ENV
        value: production
    healthCheckPath: /health
    # Rev. 92.b: auto-deploy desactivado para iterar el orchestrator
    # localmente sin que cada push a develop lance redeploy en Render.
    # Para promover una versión a Render: "Manual Deploy" desde
    # dashboard. Re-activar a `true` cuando termine la iteración.
    branch: production
    autoDeploy: true
