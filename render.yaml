# render.yaml — Konvi Platform
# Infraestructura como código para Render.com
# Referencia oficial: https://render.com/docs/blueprint-spec
# Última actualización: 2026-04-25 (v8 — nuevas vars post sesiones rev. 57-59)
#
# USO:
#   1. Render detecta este archivo automáticamente desde el repo
#   2. Configurar las env vars (sync: false) manualmente en Render Dashboard
#   3. Ver contexto operativo actualizado en docs/HANDOFF.md
#   4. Referencia canónica de variables: .env.example
#
# HISTORIAL:
#   v1–v7: ver historial anterior
#   v8: CONVERSATION_HISTORY_LIMIT=25 (era 10), vars de R-01/R-03/R-09/R-10
#       API_RATE_LIMIT_DISTRIBUTED=true (rate limiter distribuido PostgreSQL)
#       PENDING_PAYMENT_RELEASE_* (job de liberación de stock expirado)
#       ANTI_HIBERNATION_* (ping anti-hibernación Render Free)
#       MAX_PROCESSING_ATTEMPTS=5 (era implícito — se hace explícito)

services:

  # ─────────────────────────────────────────────────────────────────────────
  # 1. FRONTEND — Next.js Backoffice
  #    URL: https://commerce-ops-web.onrender.com
  #    FIX: eliminadas dependencias workspace:* que rompían npm install en Render
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: commerce-ops-web
    runtime: node
    region: oregon
    plan: free
    rootDir: apps/web
    # Memory profile build: next build + Sentry instrumentation peak ~1.3 GB RSS.
    # Render build container = más RAM que runtime (runtime free=512 MB; build
    # container típicamente 2-4 GB en Free tier). 1500 MB Node heap deja margen.
    # Si vuelve OOM: subir a 2048 o migrar el wrap Sentry (sin auth token skip).
    buildCommand: npm install --include=dev && NODE_OPTIONS='--max-old-space-size=1500' npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      # ──── Supabase API keys ───────────────────────────────────────────────
      # Sistema NUEVO (canónico): Publishable + Secret keys.
      # Legacy ANON_KEY/SERVICE_ROLE_KEY se mantienen mientras código migra
      # en A0.2b/A0.2c — eliminar legacy en sub-fase posterior.
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false                              # sb_publishable_* — cliente browser
      - key: SUPABASE_SECRET_KEY
        sync: false                              # sb_secret_* — SSR + auth.admin.*
      # LEGACY (eliminar post A0.2b refactor apps/web/utils/supabase/*.ts)
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false                              # [DEPRECATED] reemplazado por PUBLISHABLE_KEY
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false                              # [DEPRECATED] reemplazado por SECRET_KEY
      # URL pública del frontend — leida en runtime por Server Actions (invite flow)
      # SIN prefijo NEXT_PUBLIC_ para evitar bake-in en tiempo de build
      - key: APP_URL
        value: https://commerce-ops-web.onrender.com
      - key: API_URL
        value: https://commerce-ops-api.onrender.com
      # Rev. 72 — GEMINI_API_KEY ya NO se expone al servicio web (cierra drift D3).
      # El cálculo de embeddings KB se delegó al API service (POST /api/v1/knowledge-base).
      # Si este servicio se redeploya con la var todavía configurada en el dashboard de
      # Render, basta con eliminarla manualmente — no hay código que la use.
      # Rev. 109 J.2.7.4 — Sentry tracing E2E. 4 vars: 2 server + 2 browser bundle.
      - key: SENTRY_DSN
        sync: false                              # konvi-web project DSN
      - key: SENTRY_TRACES_RATE
        value: "0.1"
      - key: SENTRY_ENV
        value: production
      - key: NEXT_PUBLIC_SENTRY_DSN              # MISMO valor que SENTRY_DSN (bundle)
        sync: false
      - key: NEXT_PUBLIC_SENTRY_TRACES_RATE
        value: "0.1"
      - key: NEXT_PUBLIC_SENTRY_ENV
        value: production
      # Build-time: source map upload + release tagging. Sin esto Sentry
      # muestra stack traces minified — debugging produccion limitado.
      - key: SENTRY_ORG
        value: konvi
      - key: SENTRY_PROJECT
        value: konvi-web
      - key: SENTRY_AUTH_TOKEN
        sync: false                              # sntrys_... con scope project:releases
    healthCheckPath: /
    autoDeploy: false

  # ─────────────────────────────────────────────────────────────────────────
  # 2. WHATSAPP CONNECTOR — FastAPI Webhook Gateway
  #    URL: https://commerce-ops-connector.onrender.com
  #    Stack: FastAPI + supabase==2.28.3 + httpx==0.28.1
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: commerce-ops-connector
    runtime: python
    region: oregon
    plan: free
    rootDir: services/connector-whatsapp
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      # ──── Supabase Secret key (NEW canonical) + legacy SERVICE_ROLE_KEY ───
      # Legacy se elimina post A0.2c (refactor services/connector-whatsapp/services/db_persistence.py).
      - key: SUPABASE_SECRET_KEY
        sync: false                              # sb_secret_*
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false                              # [DEPRECATED] reemplazado por SECRET_KEY
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Rev. 109 J.2.7.4 — Sentry tracing (konvi-connector project DSN).
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_RATE
        value: "0.1"
      - key: SENTRY_ENV
        value: production
    healthCheckPath: /health
    autoDeploy: false

  # ─────────────────────────────────────────────────────────────────────────
  # 3. CORE API — FastAPI REST Gateway (Fase 6 ✅)
  #    URL: https://commerce-ops-api.onrender.com
  #    Stack: FastAPI + supabase==2.28.3 + PyJWT==2.10.1
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: commerce-ops-api
    runtime: python
    region: oregon
    plan: free
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      # ──── Supabase Secret key (NEW canonical) + legacy SERVICE_ROLE_KEY ───
      # Legacy se elimina post A0.2c (refactor services/api/dependencies/auth.py + main.py).
      - key: SUPABASE_SECRET_KEY
        sync: false                              # sb_secret_*
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false                              # [DEPRECATED] reemplazado por SECRET_KEY
      # JWT secret (legacy HS256) — aún requerido por auth.py + payment_link_tool +
      # shipping_quote_tool hasta refactor A0.2b (JWKS asymmetric) + A0.2c
      # (INTERNAL_SERVICE_SECRET para service-to-service).
      - key: SUPABASE_JWT_SECRET
        sync: false                              # [TRANSITIONAL] eliminar post-A0.2b/c
      # Service-to-service auth (orchestrator → api) post-A0.2c. Lee internal_auth.py.
      - key: INTERNAL_SERVICE_SECRET
        sync: false                              # openssl rand -hex 32 (NUEVO)
      - key: ALLOWED_ORIGINS
        sync: false
      # Rev. 72 — Embeddings KB ahora se calculan server-side aquí (cierra drift D3).
      # Mover el valor desde el servicio web (donde estaba antes) a este.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBEDDING_FALLBACK_MODEL
        value: text-embedding-004
      # ── MeLi OAuth (Fase 10) — requiere IH-007: registrar app en MeLi Developers ──
      - key: MELI_CLIENT_ID
        sync: false
      - key: MELI_CLIENT_SECRET
        sync: false
      - key: MELI_REDIRECT_URI
        sync: false
        # Valor: https://commerce-ops-api.onrender.com/api/v1/integrations/meli/callback
      - key: MELI_AUTH_URL
        sync: false
        # CO: https://auth.mercadolibre.com.co/authorization (default)
        # MX: https://auth.mercadolibre.com.mx/authorization
        # AR: https://auth.mercadolibre.com.ar/authorization
      - key: MELI_OAUTH_STATE_SECRET
        sync: false
      # ── Telegram Webhook bidireccional (F6) ────────────────────────────────
      # Secret configurado en setWebhook — enviado por Telegram en X-Telegram-Bot-Api-Secret-Token
      # IH: curl "https://api.telegram.org/bot{TOKEN}/setWebhook" -d "url=...&secret_token={VALOR}"
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: MELI_OAUTH_STATE_TTL_SECONDS
        value: "600"
      - key: PLAN_ENFORCEMENT_ENABLED
        value: "true"
      # Nota rev. 109: ENVIA_PHASE2_ENABLED eliminado con pivote a Aveonline (ADR-0019).
      - key: API_RATE_LIMIT_ENABLED
        value: "true"
      - key: API_RATE_LIMIT_WRITE_PER_MINUTE
        value: "120"
      - key: API_RATE_LIMIT_SEND_PER_MINUTE
        value: "40"
      - key: API_RATE_LIMIT_DISTRIBUTED
        value: "true"
      # ── MeLi webhook origin allowlist (opcional override) ───────────────────
      # Default en código incluye las 4 IPs oficiales (verificada 2026-04-28).
      # Configurar aquí solo si MeLi cambia las IPs antes del próximo redeploy.
      - key: MELI_WEBHOOK_ALLOWED_IPS
        sync: false
      # ── MeLi alerta proactiva (rev. 69) ─────────────────────────────────────
      # Si N rechazos de origen excede el umbral en la ventana, log warning
      # estructurado para que el operador filtre en Render Dashboard.
      - key: MELI_WEBHOOK_ALERT_THRESHOLD
        value: "5"
      - key: MELI_WEBHOOK_ALERT_WINDOW_SECONDS
        value: "300"
      # ── Wompi — credenciales por-tenant en Supabase Vault (tenant_integrations) ──
      # Las llaves de Wompi se ingresan por tenant en Ajustes → Integraciones → Wompi.
      # No se necesitan env vars globales para Wompi.
      # Rev. 109 J.2.7.4 — Sentry tracing (konvi-api project DSN).
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_RATE
        value: "0.1"
      - key: SENTRY_ENV
        value: production
    healthCheckPath: /health
    autoDeploy: false

  # ─────────────────────────────────────────────────────────────────────────
  # 4. AI ORCHESTRATOR — Web Service con worker en thread de fondo
  #    URL: https://commerce-ops-orchestrator.onrender.com (solo /health y /status)
  #    FIX: type:worker no disponible en Free → type:web con server.py wrapper
  #    El OrchestratorWorker corre en un daemon thread dentro del mismo proceso.
  #    Referencia: https://render.com/docs/free#free-web-services
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: commerce-ops-orchestrator
    runtime: python
    region: oregon
    plan: free
    rootDir: services/ai-orchestrator
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      # ──── Supabase Secret key (NEW canonical) + legacy SERVICE_ROLE_KEY ───
      # Legacy se elimina post A0.2c (refactor worker.py + server.py + tools/).
      - key: SUPABASE_SECRET_KEY
        sync: false                              # sb_secret_*
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false                              # [DEPRECATED] reemplazado por SECRET_KEY
      # JWT secret (legacy HS256) — aún requerido por payment_link_tool + shipping_quote_tool
      # hasta refactor A0.2c (INTERNAL_SERVICE_SECRET header-based).
      - key: SUPABASE_JWT_SECRET
        sync: false                              # [TRANSITIONAL] eliminar post-A0.2c
      # Service-to-service auth (orchestrator → api) post-A0.2c.
      - key: INTERNAL_SERVICE_SECRET
        sync: false                              # openssl rand -hex 32 (NUEVO)
      - key: API_URL
        value: https://commerce-ops-api.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBEDDING_FALLBACK_MODEL
        value: text-embedding-004
      - key: INBOX_SHIPPING_DEFAULT_WEIGHT_KG
        value: "1"
      - key: INBOX_SHIPPING_DEFAULT_LENGTH_CM
        value: "10"
      - key: INBOX_SHIPPING_DEFAULT_WIDTH_CM
        value: "10"
      - key: INBOX_SHIPPING_DEFAULT_HEIGHT_CM
        value: "10"
      - key: INBOX_SHIPPING_TIMEOUT_SECONDS
        value: "25"
      - key: POLL_INTERVAL_SECONDS
        value: "3"
      - key: CONVERSATION_HISTORY_LIMIT
        value: "25"
      - key: CONVERSATION_WINDOW_HOURS
        value: "24"
      - key: HUMAN_TAKEOVER_QUEUE_ENABLED
        value: "true"
      - key: HUMAN_TAKEOVER_QUEUE_POLL_BATCH
        value: "10"
      - key: HUMAN_TAKEOVER_QUEUE_VT_SECONDS
        value: "90"
      - key: WHATSAPP_OUTBOUND_QUEUE_ENABLED
        value: "true"
      - key: WHATSAPP_OUTBOUND_QUEUE_POLL_BATCH
        value: "20"
      - key: WHATSAPP_OUTBOUND_QUEUE_VT_SECONDS
        value: "90"
      - key: WHATSAPP_OUTBOUND_MAX_ATTEMPTS
        value: "5"
      - key: IDEMPOTENCY_CLEANUP_ENABLED
        value: "true"
      - key: IDEMPOTENCY_CLEANUP_INTERVAL_SECONDS
        value: "3600"
      - key: IDEMPOTENCY_CLEANUP_BATCH
        value: "2000"
      # ── Liberación de pedidos pending_payment expirados (R-01) ────────────
      - key: PENDING_PAYMENT_RELEASE_ENABLED
        value: "true"
      - key: PENDING_PAYMENT_RELEASE_INTERVAL_SECONDS
        value: "600"
      - key: PENDING_PAYMENT_TTL_MINUTES
        value: "35"
      # ── Rev. 103 F1 — Recordatorio de pago dentro CSW (Meta 24h) ──────────
      - key: PAYMENT_REMINDER_ENABLED
        value: "true"
      - key: PAYMENT_REMINDER_INTERVAL_SECONDS
        value: "60"
      - key: PAYMENT_REMINDER_DELAY_MINUTES
        value: "25"
      - key: PAYMENT_REMINDER_WINDOW_MINUTES
        value: "5"
      - key: META_CSW_HOURS
        value: "24"
      # ── Anti-hibernación Render Free (R-10) ───────────────────────────────
      # ANTI_HIBERNATION_PING_URL: configurar en Render Dashboard (sync: false)
      # Formato: URLs separadas por coma, ej:
      #   https://commerce-ops-api.onrender.com/health,https://commerce-ops-connector.onrender.com/health
      - key: ANTI_HIBERNATION_ENABLED
        value: "true"
      - key: ANTI_HIBERNATION_PING_URL
        sync: false
      - key: ANTI_HIBERNATION_INTERVAL_SECONDS
        value: "840"
      - key: MAX_PROCESSING_ATTEMPTS
        value: "5"
      # ── Multimodal audio (rev. 67) ────────────────────────────────────────
      # Comprensión de audios WhatsApp via Gemini 2.5 Flash multimodal.
      # Default "true" — apagar a "false" sin redeploy si hay issues en producción.
      - key: MULTIMODAL_AUDIO_ENABLED
        value: "true"
      - key: META_MEDIA_MAX_BYTES
        value: "16777216"
      - key: META_MEDIA_DOWNLOAD_TIMEOUT_SECONDS
        value: "10"
      # ── Customer context — cliente conocido (rev. 69) ─────────────────────
      # 'lazy' carga el bloque solo si la query menciona pedido/orden/envío/reclamo.
      # 'always' siempre carga (rev. 68). 'disabled' nunca.
      - key: CUSTOMER_CONTEXT_ENABLED
        value: "true"
      - key: CUSTOMER_CONTEXT_MODE
        value: "lazy"
      # ── Cart recovery (F7-lite, rev. 70) ─────────────────────────────────
      # Inyecta carrito previo cancelado al system prompt para que el bot
      # ofrezca retomar cuando el cliente vuelve a expresar intención de compra.
      - key: CART_RECOVERY_ENABLED
        value: "true"
      - key: CART_RECOVERY_LOOKBACK_DAYS
        value: "7"
      # ── Habeas Data — notificaciones email vía Resend (rev. 94) ──────────
      # Sin RESEND_API_KEY: notifications.py loguea en lugar de enviar email
      # (fallback graceful, no rompe flujo). Para activar en producción:
      # 1. Crear cuenta en https://resend.com (free tier 100 emails/día).
      # 2. Configurar la API key en Render Dashboard (sync: false).
      # 3. Verificar dominio en Resend si se quiere from custom.
      - key: RESEND_API_KEY
        sync: false                              # Configurar en Render Dashboard
      - key: RESEND_FROM_EMAIL
        value: "Konvi <noreply@commerce-ops.local>"
      # Rev. 109 J.2.7.4 — Sentry tracing (konvi-orchestrator project DSN).
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_RATE
        value: "0.1"
      - key: SENTRY_ENV
        value: production
    healthCheckPath: /health
    # Rev. 92.b: auto-deploy desactivado para iterar el orchestrator
    # localmente sin que cada push a develop lance redeploy en Render.
    # Para promover una versión a Render: "Manual Deploy" desde
    # dashboard. Re-activar a `true` cuando termine la iteración.
    autoDeploy: false
