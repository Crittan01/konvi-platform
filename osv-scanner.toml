# osv-scanner — allowlist de vulnerabilidades JS conocidas (W5/T7-01).
# Patrón espejo de la allowlist de pip-audit en validate.sh: se documentan las vulns
# CONOCIDAS con razón; el gate FALLA si aparece una vuln NUEVA (por exit code).
#
# Las FIJABLES las propone dependabot (.github/dependabot.yml) como PRs individuales
# testeables → al mergear cada bump se ELIMINA su entrada de aquí (ratchet decreciente).

# ── xlsx — OSV marca TODA la línea npm sin versión fixed ─────────────────────
# YELLOW-4 RESUELTO en código (2026-08-29): `xlsx` ya no es el 0.18.5 vulnerable sino
# SheetJS CE 0.20.3 (tarball oficial cdn.sheetjs.com — los fixes NO se publican en npm)
# y `xlsx-js-style` (fork abandonado sobre la misma línea vulnerable) se ELIMINÓ del árbol.
# PERO: GitHub/OSV registran ambos advisories para el paquete npm `xlsx` SIN fixed version
# (el fix solo existe en el CDN), así que el scanner flaggea CUALQUIER versión — incluida
# la 0.20.3 ya parcheada que corremos. Las entradas se conservan para no romper el gate;
# el código vulnerable ya no está instalado. Re-auditar si OSV corrige los rangos.
[[IgnoredVulns]]
id = "GHSA-4r6h-8v6p-xvw6"
reason = "xlsx prototype pollution: FIXED en 0.20.3 (tarball CDN oficial; npm nunca recibió el fix → OSV sin fixed version, flaggea toda la línea npm). Código vulnerable ya no instalado."
[[IgnoredVulns]]
id = "GHSA-5pgg-2g8v-p4x9"
reason = "xlsx ReDoS: FIXED en 0.20.3 (tarball CDN oficial; npm nunca recibió el fix → OSV sin fixed version, flaggea toda la línea npm). Código vulnerable ya no instalado."

# ── Follow-up NO bloqueante (YELLOW-4, UX) ────────────────────────────────────
# SheetJS CE no escribe estilos de celda (font/fill/border) ni `!freeze` — la plantilla
# del mass-importer perdió formato visual al migrar (contenido, anchos y alturas intactos).
# Si UX lo requiere: evaluar exceljs SOLO para generar la plantilla (nunca para parsear
# input de usuario sin revisar su superficie). NO reinstalar xlsx-js-style.

# ── Entradas históricas RETIRADAS 2026-08-29 ──────────────────────────────────
