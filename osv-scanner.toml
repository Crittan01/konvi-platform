# osv-scanner — allowlist de vulnerabilidades JS conocidas (W5/T7-01).
# Patrón espejo de la allowlist de pip-audit en validate.sh: se documentan las vulns
# CONOCIDAS con razón; el gate FALLA si aparece una vuln NUEVA (por exit code).
