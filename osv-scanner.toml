# osv-scanner — allowlist de vulnerabilidades JS conocidas (W5/T7-01).
# Patrón espejo de la allowlist de pip-audit en validate.sh: se documentan las vulns
# CONOCIDAS con razón; el gate FALLA si aparece una vuln NUEVA (por exit code).
#
# Las FIJABLES las propone dependabot (.github/dependabot.yml) como PRs individuales
# testeables → al mergear cada bump se ELIMINA su entrada de aquí (ratchet decreciente).
# Las SIN FIX upstream (xlsx) se conservan hasta el follow-up de código.

# ── xlsx 0.18.5 — SIN FIX upstream (paquete fork abandonado) ──────────────────
# Follow-up W5/T7-02 (decisión founder: split read-path): quitar `xlsx`, migrar la
# LECTURA de archivos subidos a un parser parcheado, dejar xlsx-js-style solo para
# ESCRITURA de plantillas (sin input no confiable). Hasta entonces, ignorado con nota.
[[IgnoredVulns]]
id = "GHSA-4r6h-8v6p-xvw6"
reason = "xlsx 0.18.5 prototype pollution — sin fix upstream. Follow-up T7-02 split read-path."
[[IgnoredVulns]]
id = "GHSA-5pgg-2g8v-p4x9"
reason = "xlsx 0.18.5 ReDoS — sin fix upstream. Follow-up T7-02 split read-path."

# ── brace-expansion ReDoS — SIN versión fixed+compatible ──────────────────────
# GHSA-mh99 afecta TODAS las versiones < 5.0.8. La única fixed (5.0.8) cambió el
# export CJS (ESM-first: `{default: expand}`) y rompe minimatch@3.1.5 con
# `TypeError: expand is not a function` (minimatch es transitivo de glob/eslint y
# hace `require('brace-expansion')()` directo). Todas las versiones CALLABLE (1.x/2.x)
# están afectadas. Build-time only: minimatch matchea paths/globs CONFIABLES, no input
# de atacante en runtime → sin superficie explotable. Los consumidores 5.x-native SÍ
# van a la 5.0.8 fixed (override @5). Re-evaluar si minimatch upstream adopta el nuevo export.
[[IgnoredVulns]]
id = "GHSA-mh99-v99m-4gvg"
reason = "brace-expansion ReDoS: única fixed (5.0.8) rompe minimatch@3.1.5 (export CJS cambiado); todas las callable (1.x/2.x) afectadas. Build-time only (glob/eslint sobre paths confiables). 5.x-native ya en 5.0.8."

