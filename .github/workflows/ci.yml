name: CI

on:
  pull_request:
    branches: [develop, "phase-*"]
  push:
    # W-cost (2026-07-19): `production` RETIRADA de push. El deploy es Render autoDeploy
    # (observa la rama `production`, NO usa GH Actions); el commit que se pushea es idéntico
    # al ya validado en `develop` → re-correr CI ahí era 100% redundante (~13.5 min/deploy).
    # `develop` = trunk: sí valida el resultado real del merge (squash produce un SHA nuevo).
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  PNPM_VERSION: "10.33.0"

jobs:
  # W-cost: detecta qué DOMINIO cambió para correr solo los jobs relevantes.
  # FAIL-SAFE: si no puede determinar los archivos (FILES vacío) → corre TODO
  # (nunca omite validación por incertidumbre — la calidad prima sobre el ahorro).
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - id: f
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" 2>/dev/null || true
            BASE="$(git merge-base HEAD "origin/${{ github.base_ref }}" 2>/dev/null || echo "")"
            if [ -n "$BASE" ]; then RANGE="$BASE...HEAD"; else RANGE=""; fi
          else
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              RANGE="${BEFORE}..HEAD"
            else
              RANGE="HEAD~1..HEAD"
            fi
          fi
          FILES=""
          if [ -n "$RANGE" ]; then FILES="$(git diff --name-only $RANGE 2>/dev/null || true)"; fi
          echo "range=$RANGE"
          echo "changed files:"; echo "$FILES"
          be=false; fe=false
          if echo "$FILES" | grep -qE '^(services/|supabase/migrations/|tests/|scripts/|\.github/workflows/ci\.yml)'; then be=true; fi
          # `package.json` y `osv-scanner.toml` faltaban: un cambio de dependencias JS
          # que sólo tocara esos archivos no disparaba NINGÚN job (2026-07-20).
          if echo "$FILES" | grep -qE '^(apps/web/|packages/|pnpm-lock\.yaml|package\.json|osv-scanner\.toml|\.github/workflows/ci\.yml)'; then fe=true; fi
          # FAIL-SAFE: sin archivos detectados (primer push, force-push, error) → correr TODO.
          if [ -z "$FILES" ]; then be=true; fe=true; fi
          echo "backend=$be" >> "$GITHUB_OUTPUT"
          echo "frontend=$fe" >> "$GITHUB_OUTPUT"
          echo "→ backend=$be frontend=$fe"

  validate:
    name: validate.sh (full pipeline)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Sin cambios backend — validate.sh omitido (sigue el escaneo de deps JS)
        if: needs.changes.outputs.backend != 'true'
        run: echo "No hubo cambios backend/Python/migraciones/tests → validate.sh no aplica. ✅"

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # W-cost: cache de pip (evita reinstalar deps de los 3 servicios cada run).
          cache: pip
          cache-dependency-path: |
            services/api/requirements.txt
            services/ai-orchestrator/requirements.txt
            services/connector-whatsapp/requirements.txt

      - name: Install Python dependencies
        if: needs.changes.outputs.backend == 'true'
        run: |
          python -m pip install --upgrade pip
          for svc in services/api services/ai-orchestrator services/connector-whatsapp; do
            if [ -f "$svc/requirements.txt" ]; then
              pip install -r "$svc/requirements.txt"
            fi
          done
          # pytest es OBLIGATORIO: validate.sh prefiere pytest y solo cae a
          # `unittest discover` si está ausente — y unittest enmascara/errorea
          # tests cross-test que pytest corre bien (rev.111). Sin pytest aquí el
          # CI reportaba 124 errors espurios + coverage artificialmente baja.
          pip install ruff coverage pip-audit pytest pytest-xdist pytest-cov

      - name: Setup pnpm ${{ env.PNPM_VERSION }}
        if: needs.changes.outputs.backend == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node ${{ env.NODE_VERSION }}
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Node dependencies
        if: needs.changes.outputs.backend == 'true'
        run: pnpm install --frozen-lockfile

      # COMPAT SHIM (deuda técnica — FOLLOW-UP): ~187 archivos de test usan
      # sys.path.insert / Path() con el path ABSOLUTO del dev
      # (/home/ansible/workspaces/konvi-platform). En CI el repo está en
      # $GITHUB_WORKSPACE → esos paths no existen → 34 errores de colección.
      # El fix CORRECTO es hacer los paths portables (os.path.abspath relativo),
      # pero son 187 archivos con patrones mixtos → merece su propio PR. Hasta
      # entonces, este symlink hace resolver los paths absolutos en CI sin tocar
      # los tests. Reversible: borrar este step cuando los tests sean portables.
      - name: Compat symlink para tests con path absoluto (deuda — follow-up)
        if: needs.changes.outputs.backend == 'true'
        run: |
          sudo mkdir -p /home/ansible/workspaces
          sudo ln -sfn "$GITHUB_WORKSPACE" /home/ansible/workspaces/konvi-platform

      # W5/T7-01 — osv-scanner para el gate de vulnerabilidades JS (validate.sh --full).
      - name: Install osv-scanner
        if: needs.changes.outputs.backend == 'true'
        run: |
          curl -sL --retry 2 -m 90 \
            "https://github.com/google/osv-scanner/releases/download/v2.2.4/osv-scanner_linux_amd64" \
            -o /usr/local/bin/osv-scanner
          sudo chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Run validate.sh (CI strict)
        if: needs.changes.outputs.backend == 'true'
        env:
          CI_STRICT: "true"
        run: bash scripts/validate.sh --ci

      # HUECO CERRADO (2026-07-20): el gate de vulnerabilidades JS vive DENTRO de
      # validate.sh, que está gateado por `backend`. Un cambio SOLO del lockfile
      # (el caso donde más importa, y el 99% de los PRs de Dependabot JS) no
      # ejecutaba el escaneo. Se detectó al corregir GHSA-3jxr-9vmj-r5cp /
      # GHSA-52cp-r559-cp3m: el PR que las arreglaba pasó el CI en 8s sin escanear.
      #
      # No se resuelve metiendo el lockfile en el filtro `backend` porque eso
      # dispararía la pipeline completa (~8 min) en cada PR de Dependabot. Este
      # paso corre solo el scanner (~2s) cuando cambió el frente JS y no el backend.
      - name: osv-scanner (deps JS) — solo si cambió el frente JS y NO el backend
        if: needs.changes.outputs.backend != 'true' && needs.changes.outputs.frontend == 'true'
        run: |
          curl -sL --retry 2 -m 90 \
            "https://github.com/google/osv-scanner/releases/download/v2.2.4/osv-scanner_linux_amd64" \
            -o /usr/local/bin/osv-scanner
          sudo chmod +x /usr/local/bin/osv-scanner
          osv-scanner scan --lockfile pnpm-lock.yaml --config osv-scanner.toml

      - name: Upload coverage report
        if: needs.changes.outputs.backend == 'true' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            .coverage
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
          retention-days: 7

  db-harness:
    name: Harness DB ejecutable (RLS/authz/inbox)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Sin cambios backend/migraciones — harness omitido (solo frontend)
        if: needs.changes.outputs.backend != 'true'
        run: echo "No hubo cambios backend/migraciones → el harness DB no aplica. ✅"

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install harness deps
        if: needs.changes.outputs.backend == 'true'
        run: pip install pytest "psycopg[binary]"

      # Instalación DIRECTA del binario (con retry) en vez de supabase/setup-cli@v1:
      # la acción falló transitoriamente ("Setup Supabase CLI in 10s") en el push a
      # develop de #73 → gate flaky. El binario pinneado es determinista + reintentable.
      - name: Setup Supabase CLI
        if: needs.changes.outputs.backend == 'true'
        run: |
          VER="2.90.0"
          for attempt in 1 2 3; do
            if curl -sL --fail -m 120 \
              "https://github.com/supabase/cli/releases/download/v${VER}/supabase_linux_amd64.tar.gz" \
              -o /tmp/supabase.tar.gz; then break; fi
            echo "retry $attempt…"; sleep 5
          done
          tar -xzf /tmp/supabase.tar.gz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/supabase
          supabase --version

      # W8 (cierre #5+#4): tras los seeds replay-safe, el harness corre el schema
      # REAL (replay-desde-cero de las 222 migraciones), NO un dump de prod. Este
      # paso levanta el stack, replica desde cero y FALLA si el schema producido
      # difiere del baseline canónico comiteado (gate anti-drift). Deja el Postgres
      # local (54322) con el schema replicado para el paso siguiente (pytest).
      - name: Levantar Postgres + replay + gate anti-drift
        if: needs.changes.outputs.backend == 'true'
        run: bash scripts/schema_drift_check.sh

      - name: Correr harness (RLS deny cross-tenant + escalada + inbox SKIP LOCKED)
        if: needs.changes.outputs.backend == 'true'
        env:
          HARNESS_DB_URL: "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          # HARNESS_REQUIRED=1: en CI el harness DEBE correr. Sin esto, un DB no
          # disponible dejaría todo SKIPPED y el job VERDE — verificando NADA.
          HARNESS_REQUIRED: "1"
        run: |
          set -o pipefail
          python -m pytest tests/dbharness -q -m dbharness -p no:cacheprovider | tee /tmp/harness_out.txt
          # Belt-and-suspenders: fallar si NINGÚN test pasó (all-skipped ≠ éxito).
          if ! grep -qE "[0-9]+ passed" /tmp/harness_out.txt; then
            echo "::error::El harness no ejecutó ninguna prueba (0 passed) — gate sin valor"; exit 1
          fi

  build-web:
    name: Next.js build (apps/web)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Sin cambios frontend — build omitido (solo backend)
        if: needs.changes.outputs.frontend != 'true'
        run: echo "No hubo cambios en apps/web → el build de Next.js no aplica. ✅"

      - name: Setup pnpm
        if: needs.changes.outputs.frontend == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build apps/web
        if: needs.changes.outputs.frontend == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
        run: pnpm --filter web build
