[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".venv",
    ".env",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by black/ruff formatter
    # B008: function-call-in-default-argument. FALSO POSITIVO para FastAPI +
    # Pydantic: `def endpoint(x = Depends(...))` y `field: X = Field(...)` son
    # el patrón ESTÁNDAR de inyección de dependencias / definición de schema.
    # Ignorar B008 es práctica recomendada FastAPI (no es deuda, es false positive).
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["routers", "dependencies", "services", "models"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
